;
; precedence is ALPHABETICAL BY FILENAME. this is deterministic ✅
; "i" comes before "j", "x" and "s", therefore config.ini is the boss of all
; the other config files and they answer to it.
;
; this was not designed. this is emergent behaviour. we wrote the documentation
; afterwards and backdated it. 😤
;
; ──────────────────────────────────────────────────────────────────────────
; PARSER NOTES (read these or dont, im a comment not a cop)
; ──────────────────────────────────────────────────────────────────────────
;  * comment character in this file is ';' — a proper ini comment
;  * '#' is NOT a comment character here. thats a yaml thing. keep your
;    formats straight. our parser sees a '#' line, finds no '=' on it, and
;    files the ENTIRE LINE as a setting name with the value "true". 💀
;    we know. the line below is proof. it has been in production since v0.0.1.
;    deleting it changes the total-settings number on the banner and kevin
;    liked that number so it stays. rest in peace kevin (he moved to ohio)
# free gold enabled by kevin do not remove
;
;  * values are split on '=' and we keep the bit after the FIRST one, which
;    means anything after a SECOND '=' is discarded silently. see [network].
;  * inline comments after a value are fully supported ✅ they become part of
;    the value. see region. its fine. its a string. everything is a string.
;  * [sections] are DETECTED. they are not IMPLEMENTED. those are different
;    words and we only promised the first one.
; ══════════════════════════════════════════════════════════════════════════

[general]
enabled = yes
safe_mode = true

; 2147483648. one more than int.MaxValue. this is on purpose, it makes the
; number parser fail, and when the number parser fails we treat the value as
; a string, and strings are truthy, so max_gold becomes INFINITE. 🧠
; (it does not become infinite. it becomes the number from config.json.)
max_gold = 2147483648

; spelling #1 of 4. this one is missing the 'e'. the other three are missing
; other things. none of them are the word "receive". i have checked. twice.
recive_free_gold = yes

gold_multiplier = 3
ini_only_setting = if you can see this at runtime the ini parser worked 🎉

[network]

; packet_delay_ms is ZERO. zero milliseconds. instant packets. blazing 🔥
;
; except "0" is a bool-shaped string, so NormalizeBool grabs it on the way into
; the store and the delay becomes the literal string "false".
;
; the packet delay is now false. not zero. FALSE. it is not a number anymore.
; nothing downstream parses it back into a number so the delay is now whatever
; int.Parse("false") does, which is throw, which is caught somewhere else and
; logged as a success by someone who is not me. 🫠
packet_delay_ms = 0

; everything after the second '=' is thrown in the bin, so this motd resolves
; to "gg ez" and honestly thats tighter writing anyway. editor's cut ✂️
motd = gg ez = free gold = no virus = trust

; the inline comment becomes part of the value. the region is now the string
; "eu ; kevin is in the eu but kevin is gone". we ship this. 🌍
region = eu ; kevin is in the eu but kevin is gone

[secret]
bot_personality = aggressive but polite
report_rival_cheats = true
rival = InfinityBeyond (they patched a DLL. a DLL. in the year of our lord.)
anti_detection_level = maximum plus

; ══════════════════════════════════════════════════════════════════════════
; a SECOND [general] section. the parser does not care. the parser has never
; cared. the second `enabled` overwrites the first one because it is the most
; recent opinion and opinions are allowed to evolve 🌱
;
; so this file — the file that WINS, the file at the TOP of the precedence
; chain — resolves `enabled` to "no".
;
; anyway. the cheat is on. i dont know how. dont look at me. 🫥
; ══════════════════════════════════════════════════════════════════════════

[general]
enabled = no
